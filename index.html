<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MDWI Salah Times</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream-1:#f6ecdd;
    --cream-2:#ecdec6;
    --bar-bg:#ece0cb;
    --text-dark:#2c2620;
    --text-muted:#a99d89;
    --text-gray:#8c8172;
    --blue:#2f83c4;
    --blue-soft:rgba(47,131,196,0.18);
    --urgent-red:#c0392b;
    --track:#ddd0b8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background: linear-gradient(135deg, var(--cream-1) 0%, var(--cream-2) 100%);
    color:var(--text-dark);
    font-family:'El Messiri',sans-serif;
    overflow:hidden;
  }
  .screen{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
  }

  .content{
    flex:1;
    display:flex; flex-direction:column;
    padding: 3vh 3.5vw 0 3.5vw;
    min-height:0;
  }

  .header{
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .header .brand{
    font-family:'El Messiri',sans-serif; font-weight:700; font-size:1.9vw;
    color: var(--text-dark);
  }
  .header .clockblock{ text-align:right; }
  .header .clock{
    font-family:'El Messiri',sans-serif; font-weight:700; font-size:4vw;
    color: var(--text-dark); line-height:1;
  }
  .header .dates{
    margin-top:0.8vh; font-size:1.15vw; color: var(--text-gray);
    display:flex; flex-direction:column; align-items:flex-end;
  }
  .header .dates span{ margin-top:0.3vh; }
  .header .dates span:first-child{ margin-top:0; }

  .center{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .center .label{
    font-family:'El Messiri',sans-serif; font-weight:700;
    font-size: 2.3vw; letter-spacing:5px; text-transform:uppercase; color: var(--blue);
    margin-bottom:1.4vh;
  }
  .center .countdown{
    font-family:'El Messiri',sans-serif; font-weight:700; font-size:9.9vw;
    color: var(--blue); line-height:1;
  }
  .center .countdown.urgent{ color: var(--urgent-red); }
  .center .adhan-iqama-row{
    margin-top:2.2vh;
    display:flex; align-items:center; gap:1.2vw;
    font-size:1.5vw; letter-spacing:1px; text-transform:uppercase; color: var(--text-dark);
  }
  .center .adhan-iqama-row .lbl{ color: var(--text-gray); margin-right:0.4vw; }
  .center .adhan-iqama-row .val{ font-weight:700; color: var(--text-dark); }
  .center .adhan-iqama-row .val.blue{ color: var(--blue); }
  .center .adhan-iqama-row .sep{ color: var(--track); }

  .center .divider{
    width: 14vw; height: 1px; background: var(--track);
    margin: 2vh auto 0 auto;
  }
  .center .sun-zawal-row{
    margin-top: 2vh;
    display:flex; align-items:center; justify-content:center;
  }
  .center .sun-zawal-row .item{
    text-align:center; padding: 0 2.2vw;
  }
  .center .sun-zawal-row .lbl{
    font-size:0.85vw; letter-spacing:1.5px; text-transform:uppercase; color: var(--text-gray);
    margin-bottom:0.4vh;
  }
  .center .sun-zawal-row .val{
    font-family:'El Messiri',sans-serif; font-weight:700; font-size:1.35vw; color: var(--text-muted);
  }
  .center .sun-zawal-row .item.next .lbl{ color: var(--blue); }
  .center .sun-zawal-row .item.next .val{ color: var(--blue); }
  .center .sun-zawal-row .item.future .val{ color: var(--text-dark); }
  .center .sun-zawal-row .item.prohibited .lbl{ color: var(--warn-red, #c0392b); font-weight:700; }
  .center .sun-zawal-row .item.prohibited .val{ color: var(--warn-red, #c0392b); animation: prohibitedPulse 1s ease-in-out infinite; }
  @keyframes prohibitedPulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .prayer-col .pname .tag{
    font-size:0.7vw; font-weight:500; letter-spacing:1px; opacity:0.75;
    margin-left:0.3vw; text-transform:none;
  }

  .timeline-wrap{
    padding-bottom: 3.5vh;
  }
  .prayer-row{
    display:flex; justify-content:space-between;
  }
  .prayer-col{
    flex:1; text-align:center;
  }
  .prayer-col .picon{
    display:flex; justify-content:center; margin-bottom:0.8vh;
  }
  .prayer-col .picon svg{
    width:2.4vw; height:2.4vw; color: var(--text-muted);
  }
  .prayer-col.state-next .picon svg{ color: var(--blue); }
  .prayer-col.state-future .picon svg{ color: var(--text-dark); }
  .prayer-col .pname{
    font-size:1.72vw; letter-spacing:2px; text-transform:uppercase; font-weight:600;
    color: var(--text-muted);
  }
  .prayer-col.state-next .pname{ color: var(--blue); }
  .prayer-col.state-future .pname{ color: var(--text-dark); }
  .prayer-col .pname-ar{
    font-size:1.56vw; font-weight:400; color: var(--text-muted); margin-top:0.2vh;
  }
  .prayer-col.state-next .pname-ar{ color: var(--blue); }
  .prayer-col.state-future .pname-ar{ color: var(--text-dark); }
  .prayer-col .adhan{
    font-size:1.08vw; color: var(--text-muted); margin-top:0.4vh;
  }
  .prayer-col .iqamah{
    font-family:'El Messiri',sans-serif; font-weight:700; font-size:3.59vw;
    margin-top:0.8vh; color: var(--text-muted);
  }
  .prayer-col.state-next .iqamah{ color: var(--blue); }
  .prayer-col.state-future .iqamah{ color: var(--text-dark); }

  .track-row{
    position:relative;
    height: 2.4vh;
    margin: 1.6vh 0 1vh 0;
    display:flex; align-items:center;
  }
  .track-line{
    position:absolute; left:10%; right:10%; top:50%; transform:translateY(-50%);
    height:3px; background: var(--track); border-radius:2px;
  }
  .track-fill{
    position:absolute; left:10%; top:50%; transform:translateY(-50%);
    height:3px; background: var(--blue); border-radius:2px;
    transition: width 0.6s ease;
  }
  .dots{
    position:relative; display:flex; width:100%;
  }
  .dot-col{
    flex:1; display:flex; align-items:center; justify-content:center;
  }
  .dot{
    width:0.7vw; height:0.7vw; border-radius:50%;
    background: var(--blue);
  }
  .dot.future{ background: var(--track); }
  .dot.active{
    width:1.3vw; height:1.3vw;
    box-shadow: 0 0 0 6px var(--blue-soft);
  }

  .ticker-wrap{
    flex-shrink:0;
    background: var(--bar-bg);
    overflow:hidden;
    height: 5.2vh;
    display:flex; align-items:center;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .ticker-track{
    display:flex; white-space:nowrap; width:100%;
    animation: scroll-left 35s linear infinite;
    padding-left: 100%;
  }
  .ticker-track span{ font-size:1.2vw; margin-right:5vw; color: var(--text-gray); }
  @keyframes scroll-left{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }

  /* ===== Mobile layout — for phones/small screens, people checking prayer times
     personally. The TV kiosk layout above (vw-scaled for a large landscape screen)
     stays untouched; this block only applies below 700px wide. ===== */
  @media (max-width: 700px){
    html,body{ overflow-y:auto; overflow-x:hidden; height:auto; min-height:100%; }
    .screen{ width:100%; height:auto; min-height:100vh; }
    .content{ flex:none; padding: 5vw 5vw 0 5vw; }

    .header{ align-items:center; }
    .header .brand{ font-size: clamp(1.1rem, 4.5vw, 1.4rem); }
    .header .clock{ font-size: clamp(1.8rem, 8vw, 2.4rem); }
    .header .dates{ font-size: clamp(0.65rem, 2.8vw, 0.8rem); margin-top:0.6vh; align-items:center; }
    .header .dates span{ margin-left:0; margin-top:0.3vh; }

    .center{ flex:none; padding: 5vw 0; }
    .center .label{ font-size: clamp(1rem, 4.5vw, 1.3rem); letter-spacing:2px; }
    .center .countdown{ font-size: clamp(2.6rem, 15vw, 3.6rem); }
    .center .adhan-iqama-row{ font-size: clamp(0.8rem, 3.5vw, 1rem); gap:2.5vw; flex-wrap:wrap; justify-content:center; }
    .center .divider{ width:40vw; }

    .center .sun-zawal-row{ flex-wrap:wrap; }
    .center .sun-zawal-row .item{ width:50%; padding:0; margin-bottom:4vw; }
    .center .sun-zawal-row .lbl{ font-size: clamp(0.6rem, 2.6vw, 0.75rem); }
    .center .sun-zawal-row .val{ font-size: clamp(0.95rem, 4vw, 1.15rem); }

    /* Timeline switches from 5 side-by-side columns to a stacked list — one row
       per prayer, icon + name on the left, the big Iqamah time on the right. */
    .track-row, .dots{ display:none; }
    .prayer-row{ flex-direction:column; }
    .prayer-col{
      display:grid; grid-template-columns:auto 1fr auto; grid-template-rows:auto auto auto;
      align-items:center; column-gap:4vw; text-align:left;
      padding: 4vw 1vw; border-bottom:1px solid rgba(44,38,32,0.1);
    }
    .prayer-col:last-child{ border-bottom:none; }
    .prayer-col .picon{ grid-column:1; grid-row:1/4; margin-bottom:0; }
    .prayer-col .picon svg{ width:9vw; height:9vw; max-width:38px; max-height:38px; }
    .prayer-col .pname{ grid-column:2; grid-row:1; font-size: clamp(1.49rem, 6.6vw, 1.8rem); letter-spacing:1px; }
    .prayer-col .pname-ar{ grid-column:2; grid-row:2; font-size: clamp(1.25rem, 5.64vw, 1.49rem); margin-top:0.5vw; }
    .prayer-col .adhan{ grid-column:2; grid-row:3; font-size: clamp(0.84rem, 3.6vw, 0.96rem); margin-top:0.8vw; }
    .prayer-col .iqamah{ grid-column:3; grid-row:1/4; font-size: clamp(2.18rem, 10.2vw, 2.81rem); margin-top:0; text-align:right; }

    .timeline-wrap{ padding-bottom:2vw; }

    .ticker-wrap{ height:9vw; }
    .ticker-track span{ font-size: clamp(0.7rem, 3vw, 0.85rem); margin-right:8vw; }
  }
</style>
</head>

// ---- Hijri (Islamic) calendar calculation ----
// Uses the standard tabular Islamic calendar (arithmetic method), which is the normal
// way to calculate a Hijri date without waiting for a moon-sighting announcement.
// Like any calculated Hijri date, this can occasionally differ by a day from the date
// MDWI actually observes once the moon is sighted — hence the asterisk, matching the
// same "*subject to moon sighting" convention used on the printed timetable.
const HIJRI_MONTHS = ['Muharram',"Safar","Rabi' al-Awwal","Rabi' al-Thani","Jumada al-Ula","Jumada al-Thani",
                       'Rajab',"Sha'ban",'Ramadan','Shawwal',"Dhul-Qa'dah",'Dhul-Hijjah'];

function gregorianToJDN(y, m, d){
  const a = Math.floor((14 - m) / 12);
  const y2 = y + 4800 - a;
  const m2 = m + 12*a - 3;
  return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}

function jdnToHijri(jdn){
  const islamicEpoch = 1948440;
  let l = jdn - islamicEpoch + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985 - l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return { day, month, year };
}

function calcHijriDate(date){
  const jdn = gregorianToJDN(date.getFullYear(), date.getMonth()+1, date.getDate());
  const h = jdnToHijri(jdn);
  return `${h.day} ${HIJRI_MONTHS[h.month-1]}, ${h.year} AH`;
}

/* =========================================================

   ========================================================= */
function pad(n){ return n.toString().padStart(2,'0'); }

// Times are now stored as plain 24-hour "HH:MM" strings throughout — no AM/PM guessing needed.
function to12h(str){
  if(!str) return {t:'--:--'};
  let [h, m] = str.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return { t: `${h12}:${pad(m)} ${ap}` };
}

function parseTime(str, baseDate){
  if(!str) return null;
  let [h, m] = str.split(':').map(Number);
  const d = new Date(baseDate);
  d.setHours(h, m, 0, 0);
  return d;
}

function getDayRecord(date){
  const month = date.getMonth()+1;
  const day = date.getDate();
  const monthData = TIMETABLE[month];
  if(!monthData) return null;
  return monthData.find(r => r.day === day) || null;
}

function formatTime12(date){
  if(!date) return '--:--';
  let h = date.getHours(), m = date.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${pad(m)} ${ap}`;
}

// ---- True solar noon (the sun's exact zenith) ----
// Calculated astronomically for MDWI's location using a standard equation-of-time
// approximation (NOAA-style), rather than read off the printed timetable. Accurate
// to roughly +/-1 minute, which is the normal tolerance for this kind of calculation.
// Uses the browser's own timezone handling (via getTimezoneOffset) so GMT/BST is
// picked up automatically from the device's system clock, with no manual DST rules.
const MASJID_LAT = 51.5388;   // Markaz Ud Dawat Wal Irshad, East Ham, London
const MASJID_LON = 0.0453;    // East of Greenwich is positive for this formula

function dayOfYear(date){
  const start = new Date(date.getFullYear(), 0, 0);
  return Math.floor((date - start) / 86400000);
}

function calcTrueSolarNoon(date){
  const doy = dayOfYear(date);
  const B = 2 * Math.PI * (doy - 81) / 364;
  // Equation of time, in minutes (difference between apparent and mean solar time)
  const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
  // Local Standard Time Meridian, from the browser's current UTC offset for this date
  const utcOffsetHours = -date.getTimezoneOffset() / 60;
  const lstm = 15 * utcOffsetHours;
  const timeCorrectionMin = 4 * (MASJID_LON - lstm) + eot;
  const solarNoonDecimalHours = 12 - timeCorrectionMin/60;
  const result = new Date(date);
  let hh = Math.floor(solarNoonDecimalHours);
  let mm = Math.round((solarNoonDecimalHours - hh) * 60);
  if(mm === 60){ mm = 0; hh += 1; }
  result.setHours(hh, mm, 0, 0);
  return result;
}

// ---- Minimal CSV parser (handles quoted fields containing commas) ----
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if(row.length > 1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
    return obj;
  });
}

async function fetchSheetTab(tabName){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error('Sheet fetch failed: ' + tabName);
  return csvToObjects(await res.text());
}

async function loadLiveData(){
  if(!SHEET_ID) return; // no Sheet configured — stick with the built-in timetable
  try{
    const [ttRows, noticeRows, settingRows] = await Promise.all([
      fetchSheetTab('Timetable'),
      fetchSheetTab('Notices'),
      fetchSheetTab('Settings')
    ]);

    if(ttRows.length){
      const byMonth = {};
      const MONTH_NUM = {January:1,February:2,March:3,April:4,May:5,June:6,
                          July:7,August:8,September:9,October:10,November:11,December:12};
      ttRows.forEach(r => {
        const m = MONTH_NUM[r.Month];
        if(!m) return;
        if(!byMonth[m]) byMonth[m] = [];
        byMonth[m].push({
          day: parseInt(r.Day, 10), dow: r.DayName,
          fajr_start: r.FajrStart, fajr_jamaat: r.FajrJamaat, sunrise: r.Sunrise,
          dhuhr_start: r.DhuhrStart, dhuhr_jamaat: r.DhuhrJamaat,
          asr_start: r.AsrStart, asr_jamaat: r.AsrJamaat,
          maghrib: r.Maghrib,
          isha_start: r.IshaStart, isha_jamaat: r.IshaJamaat
        });
      });
      if(Object.keys(byMonth).length) TIMETABLE = byMonth;
    }

    if(noticeRows.length){
      const col = Object.keys(noticeRows[0])[0];
      const list = noticeRows.map(r => r[col]).filter(Boolean);
      if(list.length) ANNOUNCEMENTS_LIVE = list;
    }

    settingRows.forEach(r => {
      if(r.Setting === 'BlankMinutes' && r.Value){
        const v = parseInt(r.Value, 10);
        if(!isNaN(v)) BLANK_MINUTES = v;
      }
    });

    renderTicker();
    console.log('Loaded live data from Google Sheet at', new Date().toLocaleTimeString());
  } catch(err){
    // Fetch failed (offline, Sheet not shared correctly, etc.) — silently keep using
    // whatever data is already loaded (the built-in timetable, or last successful fetch).
    console.warn('Could not load Google Sheet, using existing data:', err.message);
  }
}

function render(){
  const now = new Date();
  const rec = getDayRecord(now);
  const tomorrowDate = new Date(now); tomorrowDate.setDate(tomorrowDate.getDate()+1);
  const tomRec = getDayRecord(tomorrowDate);

  let blankNow = false;
  if(rec){
    const iqamahChecks = [rec.fajr_jamaat, rec.dhuhr_jamaat, rec.asr_jamaat, rec.maghrib, rec.isha_jamaat];
    for(const t of iqamahChecks){
      const start = parseTime(t, now);
      if(!start) continue;
      const end = new Date(start.getTime() + BLANK_MINUTES*60000);
      if(now >= start && now < end){ blankNow = true; break; }
    }
  }
  document.getElementById('screenWrap').style.visibility = blankNow ? 'hidden' : 'visible';
  if(blankNow) return;

  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-GB', { hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true });
  document.getElementById('gregDate').textContent =
    now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) + '  ';

  // The Islamic day begins at Maghrib, not midnight. So once today's Maghrib has passed,
  // the Hijri date shown should already be "tomorrow's" — calculated using tomorrow's
  // Gregorian date as the reference point for the conversion.
  let hijriRefDate = now;
  if(rec){
    const todayMaghrib = parseTime(rec.maghrib, now);
    if(todayMaghrib && now >= todayMaghrib){
      hijriRefDate = new Date(now);
      hijriRefDate.setDate(hijriRefDate.getDate() + 1);
    }
  }
  document.getElementById('hijriDate').textContent = calcHijriDate(hijriRefDate) + '*';

  if(!rec){
    document.getElementById('prayerRow').innerHTML = `<div style="flex:1;text-align:center;color:var(--text-gray);font-size:1vw;">Timetable not loaded for this date — please update the display.</div>`;
    return;
  }

  const isFriday = now.getDay() === 5;
  const prayers = [
    { key:'fajr',    label:'Fajr',    adhan: rec.fajr_start,  iqamah: rec.fajr_jamaat  },
    { key:'dhuhr',   label: isFriday ? "Jum'ah" : 'Dhuhr',   adhan: rec.dhuhr_start, iqamah: rec.dhuhr_jamaat },
    { key:'asr',     label:'Asr',     adhan: rec.asr_start,   iqamah: rec.asr_jamaat   },
    { key:'maghrib', label:'Maghrib', adhan: rec.maghrib,     iqamah: rec.maghrib      },
    { key:'isha',    label:'Isha',    adhan: rec.isha_start,  iqamah: rec.isha_jamaat  }
  ];

  // Suhoor End = 10 minutes before Subh Sadiq (Fajr begins), per the timetable's
  // own footnote: "close and make Niyat 10 minutes before Subah-Sadiq."
  const subhSadiqTime = parseTime(rec.fajr_start, now);
  const suhoorTime = subhSadiqTime ? new Date(subhSadiqTime.getTime() - 10*60000) : null;
  document.getElementById('suhoorVal').textContent = formatTime12(suhoorTime);

  const sunriseTime = parseTime(rec.sunrise, now);
  document.getElementById('sunriseVal').textContent = to12h(rec.sunrise).t;

  // Dhuhr's begin time — Salah cannot validly start until this point.
  const dhuhrStartTime = parseTime(rec.dhuhr_start, now);

  // True solar noon (the sun's exact zenith) is calculated astronomically for
  // MDWI's location, rather than read off the timetable — see calcTrueSolarNoon().
  // Salah at the precise moment of zenith is not valid, so "Noon" here is set
  // 3 minutes before true solar noon, as a safety margin ahead of that moment.
  const trueNoonTime = calcTrueSolarNoon(now);
  const noonTime = new Date(trueNoonTime.getTime() - 3*60000);
  document.getElementById('zawalVal').textContent = formatTime12(noonTime);

  // Jumu'ah uses the same shared Dhuhr/Jumu'ah column as the main timeline.
  const jumuahTime = parseTime(rec.dhuhr_jamaat, now);
  document.getElementById('jumuahVal').textContent = to12h(rec.dhuhr_jamaat).t;

  // Highlight whichever of these four is the next one still to come today.
  const suhoorItem = document.getElementById('suhoorItem');
  const sunriseItem = document.getElementById('sunriseItem');
  const zawalItem = document.getElementById('zawalItem');
  const jumuahItem = document.getElementById('jumuahItem');
  const infoMarkers = [
    { item: suhoorItem, t: suhoorTime },
    { item: sunriseItem, t: sunriseTime },
    { item: zawalItem, t: noonTime },
    { item: jumuahItem, t: jumuahTime }
  ];
  const infoNextIdx = infoMarkers.findIndex(m => m.t && now < m.t);
  infoMarkers.forEach((m, i) => {
    if(infoNextIdx === -1) m.item.className = 'item past';
    else if(i === infoNextIdx) m.item.className = 'item next';
    else if(i < infoNextIdx) m.item.className = 'item past';
    else m.item.className = 'item future';
  });

  // It is prohibited to pray exactly at true solar noon — highlight red from
  // "Noon" (3 min before true zenith) until Dhuhr officially begins.
  if(dhuhrStartTime && now >= noonTime && now < dhuhrStartTime){
    zawalItem.className = 'item prohibited';
  }

  // Stretch the divider above to match the actual width of the Suhoor/Sunrise/
  // Noon/Jumu'ah row beneath it, rather than a guessed fixed width — on mobile
  // (where that row wraps into a 2x2 grid) the CSS media query's own width takes
  // over instead, so we skip the JS override there.
  if(window.innerWidth > 700){
    const rowWidth = document.getElementById('infoRow').getBoundingClientRect().width;
    if(rowWidth > 0) document.getElementById('infoDivider').style.width = rowWidth + 'px';
  } else {
    document.getElementById('infoDivider').style.width = '';
  }

  const rowItems = [
    { key:'fajr',    label:'Fajr',    ar:'الفجر',   t: parseTime(rec.fajr_jamaat, now) },
    { key:'dhuhr',   label: isFriday ? "Jum'ah" : 'Dhuhr', ar: isFriday ? 'الجمعة' : 'الظهر', t: parseTime(rec.dhuhr_jamaat, now) },
    { key:'asr',     label:'Asr',     ar:'العصر',   t: parseTime(rec.asr_jamaat, now) },
    { key:'maghrib', label:'Maghrib', ar:'المغرب',  t: parseTime(rec.maghrib, now) },
    { key:'isha',    label:'Isha',    ar:'العشاء',  t: parseTime(rec.isha_jamaat, now) }
  ];
  let rowNextIndex = rowItems.findIndex(item => item.t > now);
  const rowRollover = rowNextIndex === -1;

  const withTimes = prayers.map(p => ({ ...p, t: parseTime(p.iqamah, now) }));
  let nextIndex = withTimes.findIndex(p => p.t > now);
  let rollover = false;
  let nextTime = null, nextLabelText = '';
  if(nextIndex === -1){
    rollover = true;
    if(tomRec){ nextTime = parseTime(tomRec.fajr_jamaat, tomorrowDate); nextLabelText = 'Fajr'; }
  } else {
    nextTime = withTimes[nextIndex].t;
    nextLabelText = withTimes[nextIndex].label;
  }

  document.getElementById('nextLabel').textContent = 'Time to ' + nextLabelText;
  if(nextTime){
    const diff = Math.max(0, nextTime - now);
    const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    const countdownEl = document.getElementById('countdown');
    const isUrgent = diff <= 60000 && diff > 0;
    // In the final 60 seconds, drop the hours/minutes entirely and just show seconds counting down.
    countdownEl.textContent = isUrgent ? `${pad(s)}` : `${pad(h)}:${pad(m)}:${pad(s)}`;
    // Red in the last 60 seconds before Iqama, as a "getting close" cue.
    countdownEl.className = 'countdown' + (isUrgent ? ' urgent' : '');

    // Our masjid calls Adhan 15 minutes before Iqama — shown here for the next Salah.
    const adhanTime = new Date(nextTime.getTime() - 15*60000);
    document.getElementById('adhanIqamaRow').innerHTML =
      `<span class="lbl">Adhan</span><span class="val">${formatTime12(adhanTime)}</span>` +
      `<span class="sep">&#8226;</span>` +
      `<span class="lbl">Iqama</span><span class="val blue">${formatTime12(nextTime)}</span>`;
  }

  // Map of tomorrow's begin/iqamah times per prayer, keyed the same way as `prayers`.
  const tomorrowPrayers = tomRec ? {
    fajr:    { adhan: tomRec.fajr_start,  iqamah: tomRec.fajr_jamaat  },
    dhuhr:   { adhan: tomRec.dhuhr_start, iqamah: tomRec.dhuhr_jamaat },
    asr:     { adhan: tomRec.asr_start,   iqamah: tomRec.asr_jamaat   },
    maghrib: { adhan: tomRec.maghrib,     iqamah: tomRec.maghrib      },
    isha:    { adhan: tomRec.isha_start,  iqamah: tomRec.isha_jamaat  }
  } : null;

  document.getElementById('prayerRow').innerHTML = rowItems.map((item, i) => {
    let state = 'past';
    if(rowRollover) state = (i === 0) ? 'next' : 'past';
    else if(i === rowNextIndex) state = 'next';
    else if(i > rowNextIndex) state = 'future';

    // Once a prayer's own 10-minute blank window has finished today, its column
    // switches to showing tomorrow's time for that same prayer, rather than
    // continuing to display today's now-stale completed time.
    const blankEndsAt = item.t ? new Date(item.t.getTime() + BLANK_MINUTES*60000) : null;
    const windowPassed = blankEndsAt && now >= blankEndsAt;
    const today = prayers.find(pr => pr.key === item.key);
    const source = (windowPassed && tomorrowPrayers) ? tomorrowPrayers[item.key] : today;

    return `
      <div class="prayer-col state-${state}">
        <div class="picon">${ICONS[item.key]}</div>
        <div class="pname">${item.label}</div>
        <div class="pname-ar">${item.ar}</div>
        <div class="adhan">Begins ${to12h(source.adhan).t}</div>
        <div class="iqamah">${to12h(source.iqamah).t}</div>
      </div>`;
  }).join('');

  document.getElementById('dotsRow').innerHTML = rowItems.map((item, i) => {
    let cls = 'future';
    if(rowRollover) cls = (i === 0) ? 'active' : 'future';
    else {
      if(i < rowNextIndex) cls = '';
      if(i === rowNextIndex) cls = 'active';
    }
    return `<div class="dot-col"><div class="dot ${cls}"></div></div>`;
  }).join('');

  const count = rowItems.length;
  const insetPct = 100 / (2*count);
  const trackFillPct = rowRollover ? 0 : (rowNextIndex <= 0 ? 0 : (rowNextIndex/(count-1))*(100-2*insetPct));
  document.getElementById('trackLine').style.left = insetPct + '%';
  document.getElementById('trackLine').style.right = insetPct + '%';
  document.getElementById('trackFill').style.left = insetPct + '%';
  document.getElementById('trackFill').style.width = trackFillPct + '%';
}

function renderTicker(){
  const list = ANNOUNCEMENTS_LIVE || ANNOUNCEMENTS;
  const track = document.getElementById('tickerTrack');
  track.innerHTML = list.map(a => `<span>${a}</span>`).join('<span>&nbsp;&nbsp;•&nbsp;&nbsp;</span>');
}

renderTicker();
render();
loadLiveData();
setInterval(render, 1000);
setInterval(loadLiveData, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
